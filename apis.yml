name: Tennr
description: >-
  Tennr is a New York City-based healthcare technology company (founded 2021)
  building agentic patient-orchestration software that automates referral-based
  care operations for providers and health systems. Its proprietary
  vision-language model, RaeLM, is trained on over 100 million anonymized
  medical documents to read faxes, referrals, and unstructured records, then
  automates document classification, data extraction, patient qualification,
  insurance eligibility verification, and prior-authorization submission by
  integrating directly with existing EHR systems. Tennr processes over 10
  million documents monthly and is HIPAA and SOC 2 compliant. It raised a $101M
  Series C at a $605M valuation led by IVP, with a16z, Lightspeed, GV, ICONIQ,
  and Foundation Capital participating. Tennr does not currently publish a
  public API, developer portal, or specification; integrations are delivered
  through EHR connections and professional services.
